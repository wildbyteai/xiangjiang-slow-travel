<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self'"><style>
*{box-sizing:border-box}body{margin:0;font:13px sans-serif;color:#233934;background:#eef4f0;overflow:hidden}svg{width:100%;height:100vh;touch-action:none}button{min-width:44px;min-height:44px;border:0;border-radius:9px;background:#fafcfb;color:#126b63;font:14px sans-serif;box-shadow:0 1px 5px #23393418}#tools{position:absolute;top:10px;left:10px;display:flex;gap:6px}#zoom{position:absolute;bottom:24px;right:10px;display:grid;gap:6px}#caption{position:absolute;bottom:5px;left:10px;font-size:10px;pointer-events:none}#plan{position:absolute;top:60px;left:10px;right:10px;padding:6px;background:#fafcfbe8;border-radius:6px;pointer-events:none;font-size:12px;line-height:1.5}#status{position:absolute;top:112px;left:10px;background:#fafcfbe8;max-width:85%;padding:4px;border-radius:4px}text{paint-order:stroke;stroke:#fafcfb;stroke-width:4px;stroke-linejoin:round;fill:#233934;font-size:12px;pointer-events:none}path,circle{vector-effect:non-scaling-stroke}button:focus-visible{outline:3px solid #126b63}
#layers{position:absolute;top:112px;left:10px;display:flex;gap:6px}#status{top:164px}#moment{position:absolute;bottom:25px;left:10px;right:62px;background:#fafcfb;padding:8px;border-radius:10px;box-shadow:0 2px 8px #23393425;display:flex;gap:8px;align-items:center}#moment[hidden]{display:none}#moment img{width:54px;height:54px;object-fit:cover;border-radius:6px}#moment a{color:#126b63;display:inline-block;padding:8px 0;min-height:44px}#moment span{font-size:12px;line-height:1.4}#moment button{margin-left:auto;min-width:44px}a:focus-visible{outline:3px solid #126b63}
</style></head><body><svg id="map" aria-label="长沙真实地理线路与实际记录点"></svg><div id="tools"><button data-view="core">湘江两岸</button><button data-view="academy">书院</button><button data-view="city">高铁站</button></div><div id="plan">第一天 · 14:00—17:30 岳麓书院<br>第二天 · 09:30—12:00 橘子洲，先看雕像</div><div id="layers"><button id="planned" aria-pressed="true">计划路线</button><button id="recorded" aria-pressed="true">记录点 0</button></div><div id="zoom"><button id="plus" aria-label="放大">＋</button><button id="minus" aria-label="缩小">−</button></div><div id="status" hidden></div><div id="moment" hidden><img id="moment-photo" alt="这一刻的首张照片" hidden><span><span id="moment-title"></span><br><a id="moment-link">打开这条日记</a></span><button id="moment-close" aria-label="关闭记录预览">×</button></div><div id="caption">© OpenStreetMap contributors / WGS84 · 记录点不是连续轨迹</div><script src="map-data.js"></script><script>
const svg=document.querySelector('svg'),NS='http://www.w3.org/2000/svg';let box,position=null,selected=[],points=GEO.points,records=[],showPlan=true,showRecords=true;
const extents={core:[[112.928,28.164],[112.974,28.204]],academy:[[112.928,28.18],[112.945,28.189]],city:[[112.927,28.142],[113.067,28.21]]};
const project=c=>[c[0]*Math.PI/180,-Math.log(Math.tan(Math.PI/4+c[1]*Math.PI/360))];
function el(type,attributes,parent=svg){const e=document.createElementNS(NS,type);for(const [k,v]of Object.entries(attributes))e.setAttribute(k,v);parent.appendChild(e);return e;}
function line(cs,close=false){return cs.map((c,i)=>(i?'L':'M')+project(c).join(',')).join('')+(close?'Z':'');}
function geometry(g){if(g.type==='Polygon')return g.coordinates.map(c=>line(c,true)).join('');if(g.type==='MultiPolygon')return g.coordinates.flatMap(p=>p.map(c=>line(c,true))).join('');if(g.type==='LineString')return line(g.coordinates);if(g.type==='MultiLineString')return g.coordinates.map(c=>line(c)).join('');return '';}
function view(name){const [a,b]=extents[name]||extents.core;const p=project(a),q=project(b),w=q[0]-p[0],h=p[1]-q[1];box=[p[0],q[1],w,h];fit();}
function fit(){svg.setAttribute('viewBox',box.join(' '));draw();}
function draw(){svg.replaceChildren();const scale=box[2]/Math.max(1,innerWidth);const g=el('g',{});
for(const f of GEO.base.features){const kind=f.properties.kind;el('path',{d:geometry(f.geometry),fill:kind==='water'?'#badbdc':kind==='park'?'#d1e2cf':kind==='academy'?'#b9cda6':'none',stroke:kind==='road'?'#d0d8d2':'none','stroke-width':kind==='road'?'1':'0','fill-rule':'evenodd'},g);}
if(showPlan)for(const f of GEO.routes){el('path',{d:geometry(f.geometry),fill:'none',stroke:f.properties.id==='metro2'?'#e1a74a':'#126b63','stroke-width':selected.includes(f.properties.id)?'4':'2','stroke-dasharray':f.properties.id==='metro2'?'5 4':'none'},g);}
for(const p of points){const [x,y]=project(p.coordinates);el('circle',{cx:x,cy:y,r:scale*4,fill:p.kind==='hotel'?'#bd8040':'#126b63','stroke':'#fafcfb','stroke-width':'1'},g);const t=el('text',{x:x+scale*7,y:y-scale*5,style:'font-size:'+scale*12+'px;stroke-width:'+scale*3+'px'},g);t.textContent=p.name;}
if(showRecords)for(const r of records){const [x,y]=project([r.longitude,r.latitude]);el('circle',{cx:x,cy:y,r:scale*11,fill:'#bd8040',stroke:'#fafcfb','stroke-width':'2'},g);const dot=el('circle',{cx:x,cy:y,r:scale*22,fill:'transparent',role:'button',tabindex:'0','aria-label':r.place+' '+r.time+'，打开记录'},g);const open=e=>{if(e.stopPropagation)e.stopPropagation();showMoment(r);};dot.onclick=open;dot.onpointerdown=e=>{if(e.stopPropagation)e.stopPropagation();};dot.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){if(e.preventDefault)e.preventDefault();open(e);}};const count=el('text',{x,y:y+scale*4,'text-anchor':'middle',style:'fill:#fff;stroke:none;font-size:'+scale*11+'px'},g);count.textContent=r.photoCount?'▣':'记';}
if(position){const [x,y]=project([position.longitude,position.latitude]);const s=document.querySelector('#status');const inBox=x>=box[0]&&x<=box[0]+box[2]&&y>=box[1]&&y<=box[1]+box[3];s.hidden=false;s.textContent=inBox?'蓝点为当前定位，精度约'+Math.round(position.accuracy)+'米':'当前位置在图外；此图只覆盖长沙线路。';el('circle',{cx:x,cy:y,r:Math.max(scale*7,position.accuracy/6378137/Math.cos(position.latitude*Math.PI/180)),fill:'#4590e52a',stroke:'#4590e5','stroke-width':'1'},g);el('circle',{cx:x,cy:y,r:scale*5,fill:'#2679cf',stroke:'#fff','stroke-width':'2'},g);}}
function showMoment(r){document.querySelector('#moment').hidden=false;document.querySelector('#moment-title').textContent=r.time.replace('T',' ')+' '+(r.place||'未填写地点')+' / '+r.photoCount+'张照片'+(r.source==='confirmed-photo-exif'?' / 照片GPS':' / 记录位置');document.querySelector('#moment-link').setAttribute('href','xiangjiang-record://open/'+r.id);const img=document.querySelector('#moment-photo');img.hidden=!r.photo;if(r.photo)img.setAttribute('src','https://appassets.xiangjiang.invalid/photo/'+r.photo);else img.removeAttribute('src');}
window.setRecords=list=>{records=(Array.isArray(list)?list:[]).filter(r=>/^[a-f0-9-]{36}$/.test(r.id)&&Number.isFinite(r.latitude)&&Number.isFinite(r.longitude)&&Math.abs(r.latitude)<85&&Math.abs(r.longitude)<=180);document.querySelector('#recorded').textContent='记录点 '+records.length;document.querySelector('#moment').hidden=true;draw();};
window.focusRecord=id=>{const r=records.find(r=>r.id===id);if(!r)return;const [x,y]=project([r.longitude,r.latitude]);box=[x-box[2]/2,y-box[3]/2,box[2],box[3]];showRecords=true;document.querySelector('#recorded').setAttribute('aria-pressed','true');fit();showMoment(r);};
document.querySelector('#moment-close').onclick=()=>{document.querySelector('#moment').hidden=true;};
document.querySelector('#planned').onclick=()=>{showPlan=!showPlan;document.querySelector('#planned').setAttribute('aria-pressed',String(showPlan));draw();};document.querySelector('#recorded').onclick=()=>{showRecords=!showRecords;document.querySelector('#recorded').setAttribute('aria-pressed',String(showRecords));if(!showRecords)document.querySelector('#moment').hidden=true;draw();};
window.setPosition=p=>{position=p;draw();};window.showStep=(v,r)=>{selected=r;view(v);};
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>view(b.dataset.view));function zoom(f){const cx=box[0]+box[2]/2,cy=box[1]+box[3]/2;box[2]*=f;box[3]*=f;box[0]=cx-box[2]/2;box[1]=cy-box[3]/2;fit();}
document.querySelector('#plus').onclick=()=>zoom(.7);document.querySelector('#minus').onclick=()=>zoom(1.4);let drag;
svg.onpointerdown=e=>{drag=[e.clientX,e.clientY,...box];svg.setPointerCapture(e.pointerId);};svg.onpointermove=e=>{if(!drag)return;const ratio=svg.getBoundingClientRect();box=[drag[2]-(e.clientX-drag[0])*drag[4]/ratio.width,drag[3]-(e.clientY-drag[1])*drag[5]/ratio.height,drag[4],drag[5]];fit();};svg.onpointerup=svg.onpointercancel=()=>drag=null;window.onresize=draw;view('core');
</script></body></html>
